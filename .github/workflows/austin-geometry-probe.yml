name: Austin Geometry Probe

on:
  push:
    paths:
      - '.github/workflows/austin-geometry-probe.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Validate Austin GeometryServer area, intersect and union operations
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const base = 'https://maps.austintexas.gov/arcgis/rest/services/Geometry/GeometryServer';
          const squareA = { rings: [[[-97.7500,30.2500],[-97.7490,30.2500],[-97.7490,30.2510],[-97.7500,30.2510],[-97.7500,30.2500]]], spatialReference:{wkid:4326} };
          const squareB = { rings: [[[-97.7495,30.2505],[-97.7485,30.2505],[-97.7485,30.2515],[-97.7495,30.2515],[-97.7495,30.2505]]], spatialReference:{wkid:4326} };

          async function post(path, params) {
            const response = await fetch(`${base}/${path}`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/x-www-form-urlencoded', Accept: 'application/json' },
              body: new URLSearchParams(params),
            });
            const text = await response.text();
            console.log(path.toUpperCase() + '_HTTP=' + response.status);
            console.log(path.toUpperCase() + '_BODY=' + text);
            if (!response.ok) throw new Error(`${path} HTTP ${response.status}`);
            const json = JSON.parse(text);
            if (json.error) throw new Error(`${path}: ${json.error.message}`);
            return json;
          }

          await post('areasAndLengths', {
            f: 'json',
            sr: '4326',
            polygons: JSON.stringify([squareA]),
            areaUnit: JSON.stringify({ areaUnit: 'esriSquareFeet' }),
            lengthUnit: '9002',
            calculationType: 'geodesic',
          });

          const intersection = await post('intersect', {
            f: 'json',
            sr: '4326',
            geometries: JSON.stringify({ geometryType:'esriGeometryPolygon', geometries:[squareB] }),
            geometry: JSON.stringify({ geometryType:'esriGeometryPolygon', geometry:squareA }),
          });

          if (!Array.isArray(intersection.geometries) || intersection.geometries.length !== 1) {
            throw new Error('Unexpected intersection response');
          }

          const union = await post('union', {
            f: 'json',
            sr: '4326',
            geometries: JSON.stringify({ geometryType:'esriGeometryPolygon', geometries:[squareA, squareB] }),
          });
          if (!union.geometry || !Array.isArray(union.geometry.rings)) throw new Error('Unexpected union response');
          NODE
