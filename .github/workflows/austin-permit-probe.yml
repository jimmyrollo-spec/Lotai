name: Austin Permit Source Probe

on:
  push:
    paths:
      - '.github/workflows/austin-permit-probe.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Validate Austin permit lookup by TCAD ID
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const query = new URLSearchParams({
            '$select': 'permittype,permit_type_desc,permit_number,permit_class_mapped,permit_class,work_class,description,tcad_id,applieddate,issue_date,status_current,statusdate,expiresdate,completed_date,total_new_add_sqft,total_job_valuation,original_address1,link',
            '$where': "tcad_id='0241061114'",
            '$order': 'issue_date DESC',
            '$limit': '5',
          });
          const url = `https://data.austintexas.gov/resource/3syk-w9eu.json?${query.toString()}`;
          const response = await fetch(url, { headers: { Accept: 'application/json' } });
          console.log(`HTTP=${response.status}`);
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          const rows = await response.json();
          console.log('COUNT=' + rows.length);
          console.log('ROWS=' + JSON.stringify(rows));
          if (!Array.isArray(rows) || rows.length === 0) throw new Error('No TCAD-matched permit rows returned');
          NODE
